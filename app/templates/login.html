{% extends "base.html" %}

{% block title %}Login — Campground Monitor{% endblock %}

{% block nav %}{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-icon">&#9978;</div>
    <h1 class="login-title">Campground Monitor</h1>
    <p class="login-subtitle">Sign in to manage your monitors</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          autocomplete="username"
          required
          autofocus
        >
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          autocomplete="current-password"
          required
        >
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
