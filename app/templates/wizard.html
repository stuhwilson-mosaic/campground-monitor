{% extends "base.html" %}

{% block title %}New Monitor — Campground Monitor{% endblock %}

{% block content %}
<div class="wizard-container">
  <div class="wizard-header">
    <h1 class="page-title">New Monitor</h1>
  </div>

  <!-- 5-step progress bar -->
  <div class="wizard-progress" id="wizard-progress">
    <div class="wizard-step active" id="step-indicator-1" data-step="1">
      <div class="step-circle">1</div>
      <div class="step-label">Location</div>
    </div>
    <div class="wizard-step-connector"></div>
    <div class="wizard-step" id="step-indicator-2" data-step="2">
      <div class="step-circle">2</div>
      <div class="step-label">Facilities</div>
    </div>
    <div class="wizard-step-connector"></div>
    <div class="wizard-step" id="step-indicator-3" data-step="3">
      <div class="step-circle">3</div>
      <div class="step-label">Dates</div>
    </div>
    <div class="wizard-step-connector"></div>
    <div class="wizard-step" id="step-indicator-4" data-step="4">
      <div class="step-circle">4</div>
      <div class="step-label">Notifications</div>
    </div>
    <div class="wizard-step-connector"></div>
    <div class="wizard-step" id="step-indicator-5" data-step="5">
      <div class="step-circle">5</div>
      <div class="step-label">Review</div>
    </div>
  </div>

  <!-- Wizard content area — partials load here via HTMX -->
  <div id="wizard-content"
       hx-get="/monitors/new/step{{ start_step | default(1) }}"
       hx-trigger="load"
       hx-swap="innerHTML">
    <div class="loading">Loading&#8230;</div>
  </div>
</div>

<!-- Prefill from a cloned monitor or a saved favorite. Delivered as a JSON
     block rather than interpolated into the script below: facility and park
     names come from a third-party CSV and contain apostrophes and non-ASCII. -->
<script id="wizard-seed" type="application/json">{{ seed_json | default('{}') | safe }}</script>

<script>
// ── Wizard state ───────────────────────────────────────────────────────────────
var wizardData = {
  step: 1,
  state: "",
  org: "",
  rec_area_id: "",
  rec_area_name: "",
  facility_ids: [],
  // Keyed by facility id, matching facility_types and the API contract.
  // This used to be an array parallel to facility_ids, zipped back together by
  // index at submit time. Removal filtered it BY VALUE, so two facilities
  // sharing a name desynchronized the arrays permanently and every later
  // facility was submitted under the wrong name.
  facility_names: {},
  facility_types: {},
  check_in: "",
  check_out: "",
  entry_date: "",
  party_size: 1,
  poll_interval_seconds: 300,
  enable_email: false,
  enable_ntfy: false,
  ntfy_topic: "",
  email_to: "",
  selected_divisions: {},  // {facility_id: [div_id, ...]}
};

// Overlay the seed, if any. Only keys actually present in the seed are
// applied, so an empty seed leaves every default untouched.
(function () {
  var el = document.getElementById("wizard-seed");
  if (!el) return;
  var seed;
  try {
    seed = JSON.parse(el.textContent || "{}");
  } catch (e) {
    return;  // A malformed seed must not break the wizard.
  }
  Object.keys(seed || {}).forEach(function (k) {
    if (seed[k] !== null && seed[k] !== undefined) wizardData[k] = seed[k];
  });
})();

// ── Step navigation ────────────────────────────────────────────────────────────
function setStep(n) {
  wizardData.step = n;
  document.querySelectorAll(".wizard-step").forEach(function(el) {
    var s = parseInt(el.dataset.step, 10);
    el.classList.toggle("active", s === n);
    el.classList.toggle("completed", s < n);
  });
}

// ── Step 1: rec area selection ─────────────────────────────────────────────────
function selectRecArea(id, name, el) {
  wizardData.rec_area_id = id;
  wizardData.rec_area_name = name;

  // Highlight selected item.
  //
  // The clicked element is passed in explicitly. This used to read the
  // implicit global `event` and use event.currentTarget, which worked only
  // because the call came from an inline onclick on the row itself. Once the
  // handler moved to a delegated listener on `document`, currentTarget became
  // `document`, whose .classList is undefined, so this threw a TypeError
  // before reaching the "enable Next" block below and clicking a park did
  // nothing at all.
  document.querySelectorAll(".rec-area-item").forEach(function(item) {
    item.classList.remove("selected");
  });
  if (el && el.classList) {
    el.classList.add("selected");
  }

  // Show selected display — use textContent to prevent XSS
  var display = document.getElementById("selected-rec-area");
  if (display) {
    display.textContent = name;
    var container = display.closest(".selected-rec-area-container");
    if (container) {
      container.style.display = "block";
    }
  }

  // Enable Next button
  var nextBtn = document.getElementById("step1-next-btn");
  if (nextBtn) {
    nextBtn.disabled = false;
  }
}

function goToStep2() {
  if (!wizardData.rec_area_id) {
    alert("Please select a park first.");
    return;
  }
  setStep(2);
  htmx.ajax("GET",
    "/monitors/new/step2?rec_area_id=" + encodeURIComponent(wizardData.rec_area_id)
      + "&rec_area_name=" + encodeURIComponent(wizardData.rec_area_name),
    { target: "#wizard-content", swap: "innerHTML" }
  );
}

// ── Step 2: facility selection ─────────────────────────────────────────────────
function updateFacilitySelection(checkbox) {
  var id = checkbox.value;
  var name = checkbox.dataset.name;
  var facType = checkbox.dataset.type || "Campground";

  if (checkbox.checked) {
    if (!wizardData.facility_ids.includes(id)) {
      wizardData.facility_ids.push(id);
    }
    wizardData.facility_names[id] = name;
    wizardData.facility_types[id] = facType;

    // For permits, show trailhead picker below the checkbox
    if (facType === "Permit") {
      showDivisionPicker(checkbox, id);
    }
  } else {
    wizardData.facility_ids = wizardData.facility_ids.filter(function(v) { return v !== id; });
    delete wizardData.facility_names[id];
    delete wizardData.facility_types[id];
    delete wizardData.selected_divisions[id];

    // Remove division picker wrapper and count
    var wrapper = document.getElementById("divisions-wrapper-" + id);
    if (wrapper) wrapper.remove();
    var countEl = document.getElementById("div-count-" + id);
    if (countEl) countEl.remove();
  }
  var selCountEl = document.getElementById("selected-facility-count");
  if (selCountEl) {
    selCountEl.textContent = wizardData.facility_ids.length + " selected";
  }
  var nextBtn = document.getElementById("step2-next-btn");
  if (nextBtn) {
    nextBtn.disabled = wizardData.facility_ids.length === 0;
  }
  applyTypeLock();
}

// ── Single facility type per monitor ──────────────────────────────────────────
//
// A monitor watches campgrounds OR wilderness permits, never both: they need
// different dates (arrive/depart vs a single entry date), and _run_check routes
// per facility, so a mixed monitor calls check_campground(id, "", "") forever.
// The server rejects mixed selections too; this just stops you building one.

function currentLockedType() {
  var ids = wizardData.facility_ids || [];
  if (!ids.length) return null;
  return wizardData.facility_types[ids[0]] || null;
}

function applyTypeLock() {
  var locked = currentLockedType();
  document.querySelectorAll('#facility-list input[type="checkbox"][data-type]')
    .forEach(function(cb) {
      // Never disable something already checked, or the user couldn't undo it.
      cb.disabled = locked !== null && cb.dataset.type !== locked && !cb.checked;
      var row = cb.closest(".facility-item") || cb.parentElement;
      if (row) row.classList.toggle("facility-type-locked", cb.disabled);
    });

  var hint = document.getElementById("facility-type-hint");
  if (!hint) return;
  if (!locked) {
    hint.style.display = "none";
    hint.textContent = "";
    return;
  }
  hint.style.display = "";
  hint.textContent =
    "This monitor is watching " +
    (locked === "Permit" ? "wilderness permits" : "campgrounds") +
    ". One monitor can't mix the two, so the rest are greyed out. " +
    "Clear your selection to switch, or create a second monitor.";
}

function restoreFacilityChecks() {
  // htmx replaces #facility-list wholesale on every type-tab click, so the DOM
  // arrives with nothing checked even though wizardData still holds the
  // selection. Without this the lock would read a stale, empty selection.
  var ids = wizardData.facility_ids || [];
  document.querySelectorAll('#facility-list input[type="checkbox"][value]')
    .forEach(function(cb) { cb.checked = ids.indexOf(cb.value) !== -1; });
}

document.addEventListener("htmx:afterSwap", function(evt) {
  if (evt.target && evt.target.id === "facility-list") {
    restoreFacilityChecks();
    applyTypeLock();
  }
});

function saveSelectionAsFavorite() {
  var msg = document.getElementById("save-favorite-msg");
  var ids = wizardData.facility_ids || [];
  if (!ids.length) {
    if (msg) msg.textContent = "Select at least one facility first.";
    return;
  }
  var label = prompt("Name this favorite:",
                     wizardData.rec_area_name || "My selection");
  if (!label) return;

  // Same shape the monitor stores, so seeding is a copy rather than a transform.
  var facilities = ids.map(function (fid) {
    var f = { id: fid,
              name: (wizardData.facility_names || {})[fid] || fid,
              type: (wizardData.facility_types || {})[fid] || "Campground" };
    var divs = (wizardData.selected_divisions || {})[fid];
    if (divs && divs.length) f.division_ids = divs;
    return f;
  });

  fetch("/api/favorites", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      label: label,
      rec_area_id: wizardData.rec_area_id || "",
      rec_area_name: wizardData.rec_area_name || "",
      facilities: facilities,
    }),
  }).then(function (r) {
    if (msg) msg.textContent = r.ok ? "Saved to favorites."
                                    : "Could not save favorite.";
  }).catch(function () {
    if (msg) msg.textContent = "Could not save favorite.";
  });
}

// Rec-area results are rebuilt by htmx on every keystroke, so the click is
// delegated rather than bound per row. The row carries the id and name in data
// attributes instead of an inline onclick: park names come from a third-party
// CSV and a name containing a quote used to break the generated markup.
document.addEventListener("click", function(evt) {
  var row = evt.target.closest ? evt.target.closest(".rec-area-item") : null;
  if (!row || !row.dataset.recAreaId) return;
  selectRecArea(row.dataset.recAreaId, row.dataset.recAreaName || "", row);
});

function showDivisionPicker(checkbox, facilityId) {
  var existing = document.getElementById("divisions-" + facilityId);
  if (existing) return;

  // Place the picker OUTSIDE the facility-list scroll container,
  // after .selected-count, so it doesn't get clipped by overflow
  var anchor = document.getElementById("selected-facility-count");
  if (!anchor) anchor = document.getElementById("facility-list");
  if (!anchor) return;

  // Create a wrapper with a label
  var wrapper = document.createElement("div");
  wrapper.id = "divisions-wrapper-" + facilityId;
  wrapper.className = "division-picker-wrapper";

  var heading = document.createElement("div");
  heading.className = "division-picker-heading text-small";
  heading.textContent = "Select trailheads for " + (checkbox.dataset.name || "permit") + ":";
  wrapper.appendChild(heading);

  var container = document.createElement("div");
  container.id = "divisions-" + facilityId;
  container.className = "division-picker";
  var loadingEl = document.createElement("div");
  loadingEl.className = "loading";
  loadingEl.textContent = "Loading trailheads\u2026";
  container.appendChild(loadingEl);
  wrapper.appendChild(container);

  anchor.parentElement.insertBefore(wrapper, anchor.nextSibling);

  // Fetch divisions via HTMX
  htmx.ajax("GET",
    "/api/permit-divisions?facility_id=" + encodeURIComponent(facilityId),
    { target: "#divisions-" + facilityId, swap: "innerHTML" }
  );
}

function updateDivisionSelection(checkbox, facilityId) {
  var divId = checkbox.value;
  if (!wizardData.selected_divisions[facilityId]) {
    wizardData.selected_divisions[facilityId] = [];
  }
  var arr = wizardData.selected_divisions[facilityId];
  if (checkbox.checked) {
    if (arr.indexOf(divId) === -1) arr.push(divId);
  } else {
    wizardData.selected_divisions[facilityId] = arr.filter(function(v) { return v !== divId; });
  }

  // Update count display
  var count = wizardData.selected_divisions[facilityId].length;
  var countEl = document.getElementById("div-count-" + facilityId);
  if (!countEl) {
    var picker = document.getElementById("divisions-" + facilityId);
    if (picker) {
      countEl = document.createElement("div");
      countEl.id = "div-count-" + facilityId;
      countEl.className = "division-count text-small text-muted";
      picker.insertAdjacentElement("beforebegin", countEl);
    }
  }
  if (countEl) {
    countEl.textContent = count > 0
      ? count + " trailhead" + (count === 1 ? "" : "s") + " selected (others ignored)"
      : "All trailheads (none specifically selected)";
  }
}

function filterDivisions(input, facilityId) {
  var q = input.value.toLowerCase();
  var container = document.getElementById("divisions-" + facilityId);
  if (!container) return;
  var items = container.querySelectorAll(".division-item");
  items.forEach(function(el) {
    var name = el.getAttribute("data-division-name") || "";
    el.style.display = name.indexOf(q) !== -1 ? "" : "none";
  });
}

function goToStep1() {
  setStep(1);
  htmx.ajax("GET", "/monitors/new/step1",
    { target: "#wizard-content", swap: "innerHTML" }
  );
}

function goToStep3() {
  if (wizardData.facility_ids.length === 0) {
    alert("Please select at least one facility.");
    return;
  }
  setStep(3);
  htmx.ajax("GET", "/monitors/new/step3",
    { target: "#wizard-content", swap: "innerHTML" }
  );
}

// ── Step 5 review helpers (use textContent, not innerHTML) ────────────────────
function renderReviewValue(elementId, value) {
  var el = document.getElementById(elementId);
  if (el) {
    el.textContent = value;
  }
}
</script>
{% endblock %}
